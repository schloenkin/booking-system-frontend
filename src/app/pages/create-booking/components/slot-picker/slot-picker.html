@if (selectedDate) {

  <h3>
    Available slots
  </h3>

  <div class="slots">

    @for (slot of availableSlots; track slot) {

      <button
        type="button"
        (click)="selectSlot(slot)"
        [class.selected]="selectedSlot === slot">

        {{ slot }}

      </button>

    }

  </div>

}
