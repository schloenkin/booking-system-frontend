<h1>My Bookings</h1>

<button routerLink="/create-booking">
  Create Booking
</button>

@for (booking of bookings; track booking.id) {

  <div class="booking-card">

    <p>
      Service: {{ booking.serviceId }}
    </p>

    <p>
      Time:
      {{ booking.startTime }}
      -
      {{ booking.endTime }}
    </p>

    <p>
      Status:
      {{ booking.status }}
    </p>

  </div>

}
