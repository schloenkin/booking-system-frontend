<div class="register-container">

  <h1>
    Create Account
  </h1>

  <p>
    Register to start managing your bookings.
  </p>

  <form>


    <input
      type="email"
      placeholder="Email"
    >


    <input
      type="password"
      placeholder="Password"
    >


    <button type="submit">
      Sign Up
    </button>

  </form>


  <a routerLink="/login">
    Already have an account? Sign In
  </a>

</div>
