<div class="login-container">

  <h1>
    Welcome Back
  </h1>


  <p>
    Sign in to manage your bookings.
  </p>


  <form
    [formGroup]="loginForm"
    (ngSubmit)="onSubmit()"
  >

    <input
      id="email"
      type="email"
      placeholder="Email"
      formControlName="email"
    >


    <input
      id="password"
      type="password"
      placeholder="Password"
      formControlName="password"
    >


    <button type="submit">
      Sign In
    </button>


  </form>


  <a routerLink="/register">
    Don't have an account? Sign Up
  </a>


</div>
